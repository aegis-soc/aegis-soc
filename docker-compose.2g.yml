# docker-compose.2g.yml —— 2 GB 内存机型的裁剪档（应急配置，非受支持）
#
# 用法：
#   cp docker-compose.2g.yml docker-compose.override.yml   # compose 会自动叠加
#   docker compose up -d --build
#   （install.sh --low-mem 会自动完成这一步，无需手工复制）
#
# 只做三件事，不动业务配置：
#   1. MySQL 缓冲池 256M→128M、关掉 performance_schema、连接数 300→100
#   2. api 单 worker、celery 并发 4→1 且每 100 个任务回收一次子进程
#   3. Redis 限内存 96M、去掉 AOF；各容器加 mem_limit 防止单个服务吃光整机
#
# ⚠️ 4 GB 及以上不要用本文件：默认配置已按 4G 调优，套用后性能反而下降。
# ⚠️ mem_limit 是上限不是预留；若某容器频繁 137 退出（docker inspect 看 OOMKilled），
#    说明该服务确实需要更多内存，请单独调大或升配。

services:
  mysql:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --default-time-zone=+08:00
    mem_limit: 700m

  redis:
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    mem_limit: 384m

  worker:
    command:
      - celery
      - -A
      - workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - aegis
      - -c
      - "1"
      - --max-tasks-per-child=100
    mem_limit: 448m

  beat:
    mem_limit: 192m

  frontend:
    mem_limit: 64m

  nginx:
    mem_limit: 48m
