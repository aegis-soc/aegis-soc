# Docker 内置 DNS（127.0.0.11）+ 变量式 proxy_pass：每次请求重新解析容器 IP。
# 若用 upstream { server api:8000; } 的写法，nginx 只在启动时解析一次并永久缓存，
# `docker compose up -d --build` 重建 api/frontend 后它们的 IP 会变，而 nginx 容器
# 没被重建，仍指向旧 IP —— 表现就是登录时 502（error.log 里 connect() failed 111）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    access_log /var/log/nginx/aegis_access.log;
    error_log  /var/log/nginx/aegis_error.log warn;

    set $aegis_api      api:8000;
    set $aegis_frontend frontend:80;

    location /api/ {
        proxy_pass http://$aegis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 人机对话/日志巡检会同步等 MCP（单流 30s × 3 流），不能按 60s 掐断
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://$aegis_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
