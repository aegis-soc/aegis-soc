# HTTPS 参考配置（可选启用）

> 与 `nginx.conf` **二选一**挂载到容器的 `/etc/nginx/conf.d/default.conf`，默认不启用。
> 启用步骤见 [../../docs/deploy-cloud.md](../docs/deploy-cloud.md) §4「启用 HTTPS」。

upstream aegis_api {
    server api:8000;
}

upstream aegis_frontend {
    server frontend:80;
}

# HTTP 全量跳转 HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name soc.example.com;   # 改成你的域名

    # 证书挂载自 ./deploy/nginx/certs/（该目录不入库，见 .gitignore）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;
    access_log /var/log/nginx/aegis_access.log;
    error_log  /var/log/nginx/aegis_error.log warn;

    location /api/ {
        proxy_pass http://aegis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://aegis_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
