name: aegis-soc

# 生产模式：api / worker / beat / frontend / mysql / redis / nginx 七容器
# 使用前：cp .env.example .env 并修改所有 change-me-* 占位值
# 数据库表结构由 sql/init.sql + sql/seed.sql 在首次启动时初始化；
# deploy/mysql/my.cnf 供独立部署参考，这里用 command 参数避免挂载文件权限问题。

x-backend-common: &backend-common
  # 三个服务共用同一个镜像 tag：`docker compose build api` 构建一次，worker/beat
  # 直接复用，不会各建一份。构建参数见 .env 的 AEGIS_* 段（默认走官方源）。
  image: ${AEGIS_BACKEND_IMAGE:-aegis-soc-backend:local}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${AEGIS_PIP_INDEX:-}
      PIP_TRUSTED_HOST: ${AEGIS_PIP_TRUSTED_HOST:-}
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --character-set-client-handshake=OFF
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=300
      - --innodb-buffer-pool-size=256M
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend-common
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose:
      - "8000"
    volumes:
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend-common
    command:
      - celery
      - -A
      - workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - aegis
      - -c
      - "4"

  beat:
    <<: *backend-common
    command:
      - celery
      - -A
      - workers.celery_app:celery_app
      - beat
      - --loglevel=info

  frontend:
    image: ${AEGIS_FRONTEND_IMAGE:-aegis-soc-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${AEGIS_NPM_REGISTRY:-}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  api-logs:
