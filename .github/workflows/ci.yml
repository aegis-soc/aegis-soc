name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 · 编译与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法编译检查
        run: python -m compileall -q app plugins workers

      - name: 单元与端到端测试（SQLite 内存库 + 同步执行，无需外部服务）
        run: python -m pytest -q

  frontend:
    name: 前端 · 依赖与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci --no-audit --no-fund

      - name: 构建产物
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  compose:
    name: 编排 · 配置校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 生成临时 .env
        run: cp .env.example .env

      - name: 校验 docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: 校验 docker-compose-demo.yml
        run: docker compose -f docker-compose-demo.yml config -q
